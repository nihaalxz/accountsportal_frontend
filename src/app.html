<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5, viewport-fit=cover" />
		<meta name="theme-color" content="#0284c7" />
		<meta name="description" content="Texas Accounts Portal - Realtime Accounting, Ledger & Financial Management System" />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
		<meta name="apple-mobile-web-app-title" content="Texas Accounts" />
		<link rel="icon" type="image/png" href="/favicon.png?v=2" />
		<link rel="icon" type="image/x-icon" href="/favicon.ico?v=2" />
		<link rel="shortcut icon" href="/favicon.ico?v=2" />
		<link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2" />
		<link rel="manifest" href="/manifest.json" />
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
		<script>
			if ('serviceWorker' in navigator) {
				window.addEventListener('load', function () {
					navigator.serviceWorker
						.register('/sw.js')
						.then(function (reg) {
							console.log('PWA ServiceWorker registered with scope:', reg.scope);
						})
						.catch(function (err) {
							console.info('PWA ServiceWorker registration failed or disabled:', err);
						});
				});
			}
		</script>
	</body>
</html>
